name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge mod (Minecraft 26.1.2)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain clean build --stacktrace > gradle-build.log 2>&1; then
            cat gradle-build.log
            {
              echo '## Gradle build failure'
              echo 'The full diagnostic output from the failing Gradle build:'
              echo '```text'
              tail -n 120 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_context="$(grep -n -E -A 35 -B 4 '^\* What went wrong:|^> |error:|Could not|Failed to|does not exist' gradle-build.log | tail -n 90 || true)"
            if [[ -z "$failure_context" ]]; then
              failure_context="$(tail -n 60 gradle-build.log)"
            fi
            diagnostic="$(printf '%s' "$failure_context" | tr '\n' ' ' | cut -c1-6000)"
            echo "::error::Gradle build failed: ${diagnostic}"
            exit 1
          fi
          cat gradle-build.log

      - name: Stage distributable mod jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'sleepwarp-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one distributable SleepWarp jar, found ${#jars[@]}" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          cp "${jars[0]}" build/release/
          echo "Prepared ${jars[0]}"

      - name: Upload compiled mod jar
        uses: actions/upload-artifact@v4
        with:
          name: sleepwarp-neoforge-26.1.2-${{ github.sha }}
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download compiled mod jar
        uses: actions/download-artifact@v4
        with:
          name: sleepwarp-neoforge-26.1.2-${{ github.sha }}
          path: release-assets

      - name: Create release with the built jar
        uses: softprops/action-gh-release@v2
        with:
          name: SleepWarp ${{ github.ref_name }} (NeoForge)
          body: |
            NeoForge build for Minecraft 26.1.2.

            This release contains the jar compiled and verified by the Build workflow.
          files: release-assets/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
